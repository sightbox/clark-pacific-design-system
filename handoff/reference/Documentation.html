  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

tify-content: space-between; padding-top: 8px; border-top: 1px solid #DEDFE0; font-family: 'Inter', sans-serif; font-size: 8pt; color: #7F8A92;\"><span>Clark Pacific Web Design System · Documentation<\u002Fspan><span>September Edition · 2026<\u002Fspan><\u002Fdiv>\n\n  <div data-screen-label=\"Cover\" style=\"font-family: 'Inter', sans-serif; color: #52565A; padding: 12px 0 28px;\">\n    <img src=\"7b4f97de-31ae-4883-b2d9-14870122ac7b\" alt=\"Clark Pacific\" style=\"height: 34px; display: block;\">\n    <div style=\"width: 48px; height: 3px; background: #FF8600; margin-top: 56px;\"><\u002Fdiv>\n    <h1 style=\"margin: 20px 0 0; font-family: 'Poppins', sans-serif; font-size: 40pt; line-height: 1.02; letter-spacing: -0.04em; text-transform: uppercase; color: #52565A;\"><span style=\"font-weight: 200;\">Web Design System<\u002Fspan><br><span style=\"font-weight: 600;\">Documentation<\u002Fspan><\u002Fh1>\n    <p style=\"margin: 22px 0 0; max-width: 560px; font-size: 12pt; line-height: 1.55;\">The rules, components and page recipes behind the Clark Pacific website, written for the web team building it in WordPress (Elementor) from the Figma file.<\u002Fp>\n    <sc-raw-table style=\"margin-top: 36px; font-size: 10pt;\">\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td style=\"padding: 8px 0; border-top: 1px solid #DEDFE0; width: 150px; color: #7F8A92;\">Edition<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0; border-top: 1px solid #DEDFE0;\">September 2026 (final handoff)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding: 8px 0; border-top: 1px solid #DEDFE0; color: #7F8A92;\">Prepared by<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0; border-top: 1px solid #DEDFE0;\">Sightbox, for Clark Pacific Marketing<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding: 8px 0; border-top: 1px solid #DEDFE0; color: #7F8A92;\">Figma file<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0; border-top: 1px solid #DEDFE0;\">Clark Pacific Web Design System (Sightbox team; Clark Pacific edit copy)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding: 8px 0; border-top: 1px solid #DEDFE0; border-bottom: 1px solid #DEDFE0; color: #7F8A92;\">Scope<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0; border-top: 1px solid #DEDFE0; border-bottom: 1px solid #DEDFE0;\">38 pages · 27 canonical components · Desktop, Tablet and Mobile<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n  <\u002Fdiv>\n\n  <div style=\"font-family: 'Inter', sans-serif; font-size: 10pt; line-height: 1.6; color: #52565A;\">\n\n    <h2 style=\"break-before: page; margin: 0 0 6px; font-family: 'Poppins', sans-serif; font-size: 20pt; letter-spacing: -0.03em; text-transform: uppercase; color: #52565A;\"><span style=\"font-weight: 300;\">01 · How to use <\u002Fspan><span style=\"font-weight: 600;\">this system<\u002Fspan><\u002Fh2>\n    <p>The system is a closed set of components. Every page on the site is an ordered stack of them, placed on white, inside one layout grid. If a page needs something the set doesn't have, add a component to the library first, then use it. Don't build a one-off on the page.<\u002Fp>\n    <h3 style=\"margin: 18px 0 6px; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 11pt; text-transform: uppercase; color: #52565A;\">What's in the package<\u002Fh3>\n    <sc-raw-table style=\"font-size: 9.5pt;\">\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td style=\"padding: 7px 10px 7px 0; border-top: 1px solid #DEDFE0; width: 190px; font-weight: 600;\">Figma file<\u002Fsc-raw-td><sc-raw-td style=\"padding: 7px 0; border-top: 1px solid #DEDFE0;\">Pages: 00 Cover · 01 Foundations · 02 Components · 03 Pages Desktop · 04 Pages Mobile · 05 Archive<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding: 7px 10px 7px 0; border-top: 1px solid #DEDFE0; font-weight: 600;\">This document<\u002Fsc-raw-td><sc-raw-td style=\"padding: 7px 0; border-top: 1px solid #DEDFE0;\">Foundations, responsive rules, component specs, page recipes, Elementor build notes, content handoff<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding: 7px 10px 7px 0; border-top: 1px solid #DEDFE0; font-weight: 600;\">HTML reference site<\u002Fsc-raw-td><sc-raw-td style=\"padding: 7px 0; border-top: 1px solid #DEDFE0;\">The 38 pages and the live design-system library, including hover and interaction behavior Figma can't show<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding: 7px 10px 7px 0; border-top: 1px solid #DEDFE0; border-bottom: 1px solid #DEDFE0; font-weight: 600;\">Assets<\u002Fsc-raw-td><sc-raw-td style=\"padding: 7px 0; border-top: 1px solid #DEDFE0; border-bottom: 1px solid #DEDFE0;\">Logos (long and stacked, positive and negative), CP_v01 line icons (stroked versions: *_Line.svg)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n    <h3 style=\"margin: 18px 0 6px; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 11pt; text-transform: uppercase; color: #52565A;\">Six rules that hold the system together<\u002Fh3>\n    <ol style=\"margin: 0; padding-left: 18px;\">\n      <li><strong>Every module sits on white.<\u002Fstrong> The only colored surfaces are CTA banners (Blue or Dark Charcoal), the footer, and boxed elements inside a module (#F0F0F0).<\u002Fli>\n      <li><strong>Two brand accents: Blue and Orange.<\u002Fstrong> Green is for sustainability content only. Teal, black and light gray are retired.<\u002Fli>\n      <li><strong>Headlines pair two weights at one size:<\u002Fstrong> Light or Regular for the context, SemiBold for the keyword, keyword last. Never Bold (700).<\u002Fli>\n      <li><strong>Type never goes darker than Dark Charcoal #52565A.<\u002Fstrong> Orange is never used as type on a dark surface.<\u002Fli>\n      <li><strong>Accent bars are a touch, not a pa : -0.03em; text-transform: uppercase; color: #52565A;\"><span style=\"font-weight: 300;\">04 · Layout, spacing &amp; <\u002Fspan><span style=\"font-weight: 600;\">responsive rules<\u002Fspan><\u002Fh2>\n    <h3 style=\"margin: 12px 0 6px; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 11pt; text-transform: uppercase; color: #52565A;\">The two-layer section<\u002Fh3>\n    <p style=\"margin: 0;\">Every section has two layers: a <strong>full-bleed outer container<\u002Fstrong> that carries the background, and an <strong>inner container<\u002Fstrong> capped at 1440px, centered, with side padding. The background runs edge to edge, and the content never stretches past 1440. The only exceptions are the sticky header, the footer, and hero photos. In Elementor, this is an outer Container (Full Width) wrapping an inner Container (Boxed, 1440).<\u002Fp>\n    <sc-raw-table style=\"font-size: 9.5pt; margin-top: 12px;\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"text-align: left; padding: 6px 8px 6px 0; border-bottom: 1.5px solid #52565A;\">Token<\u002Fsc-raw-th><sc-raw-th style=\"text-align: right; padding: 6px 8px; border-bottom: 1.5px solid #52565A;\">Desktop &gt;1024<\u002Fsc-raw-th><sc-raw-th style=\"text-align: right; padding: 6px 8px; border-bottom: 1.5px solid #52565A;\">Tablet 768–1024<\u002Fsc-raw-th><sc-raw-th style=\"text-align: right; padding: 6px 0 6px 8px; border-bottom: 1.5px solid #52565A;\">Mobile ≤767<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td style=\"padding: 6px 8px 6px 0; border-bottom: 1px solid #DEDFE0;\">Frame / content max-width<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #DEDFE0; text-align: right;\">1440 / 1296<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #DEDFE0; text-align: right;\">1024 / 944<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 0 6px 8px; border-bottom: 1px solid #DEDFE0; text-align: right;\">390 / 350<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding: 6px 8px 6px 0; border-bottom: 1px solid #DEDFE0;\">Side padding<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #DEDFE0; text-align: right;\">72<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #DEDFE0; text-align: right;\">40<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 0 6px 8px; border-bottom: 1px solid #DEDFE0; text-align: right;\">20<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding: 6px 8px 6px 0; border-bottom: 1px solid #DEDFE0;\">Section padding (vertical)<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #DEDFE0; text-align: right;\">80–96<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #DEDFE0; text-align: right;\">72<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 0 6px 8px; border-bottom: 1px solid #DEDFE0; text-align: right;\">56<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding: 6px 8px 6px 0; border-bottom: 1px solid #DEDFE0;\">Column gap (split layouts)<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #DEDFE0; text-align: right;\">72<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #DEDFE0; text-align: right;\">40<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 0 6px 8px; border-bottom: 1px solid #DEDFE0; text-align: right;\">stacked, 28<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding: 6px 8px 6px 0; border-bottom: 1px solid #DEDFE0;\">Card grid gutter<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #DEDFE0; text-align: right;\">28–32<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #DEDFE0; text-align: right;\">24<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 0 6px 8px; border-bottom: 1px solid #DEDFE0; text-align: right;\">16–28<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding: 6px 8px 6px 0; border-bottom: 1px solid #DEDFE0;\">Bar or eyebrow → headline<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #DEDFE0; text-align: right;\">20<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #DEDFE0; text-align: right;\">20<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 0 6px 8px; border-bottom: 1px solid #DEDFE0; text-align: right;\">16–20<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding: 6px 8px 6px 0; border-bottom: 1px solid #DEDFE0;\">Headline → paragraph<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #DEDFE0; text-align: right;\">20<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #DEDFE0; text-align: right;\">20<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 0 6px 8px; border-bottom: 1px solid #DEDFE0; text-align: right;\">18<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding: 6px 8px 6px 0; border-bottom: 1px solid #DEDFE0;\">Paragraph → CTA<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #DEDFE0; text-align: right;\">34<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #DEDFE0; text-align: right;\">32<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 0 6px 8px; border-bottom: 1px solid #DEDFE0; text-align: right;\">28<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding: 6px 8px 6px 0; border-bottom: 1px solid #DEDFE0;\">Image gap (mosaics, galleries)<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #DEDFE0; text-align: right;\">2<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #DEDFE0; text-align: right;\">2<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 0 6px 8px; border-bottom: 1px solid #DEDFE0; text-align: right;\">2<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding: 6px 8px 6px 0; border-bottom: 1px solid #DEDFE0;\">Minimum tap target<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #DEDFE0; text-align: right;\">n/a<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #DEDFE0; text-align: right;\">44<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 0 6px 8px; border-bottom: 1px solid #DEDFE0; text-align: right;\">44 (buttons 48)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n    <h3 style=\"margin: 18px 0 6px; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 11pt; text-transform: uppercase; color: #52565A;\">How layouts collapse<\u002Fh3>\n    <sc-raw-table style=\"font-size: 9.5pt;\">\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td style=\"padding: 6px 8px 6px 0; border-top: 1px solid #DEDFE0; width: 170px; font-weight: 600;\">Split 50/50 and 40/60<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 0; border-top: 1px solid #DEDFE0;\">Tablet keeps two columns when both hold text; otherwise it stacks. Mobile always stacks, <strong>image first<\u002Fstrong>, whichever side the image sits on at desktop.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding: 6px 8px 6px 0; border-top: 1px solid #DEDFE0; font-weight: 600;\">3- and 4-up grids<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 0; border-top: 1px solid #DEDFE0;\">4 → 2 → 1 and 3 → 2 → 1. Card rows that close a page (Featured Resources, Related Content) become a <strong>swipe row<\u002Fstrong> on mobile: 300px cards with the next one peeking, plus orange-pill dots.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding: 6px 8px 6px 0; border-top: 1px solid #DEDFE0; font-weight: 600;\">Icon grids<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 0; border-top: 1px solid #DEDFE0;\">Two columns on mobile when the body runs 1–2 lines, otherwise one. Icons shrink from 52 to 40.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding: 6px 8px 6px 0; border-top: 1px solid #DEDFE0; font-weight: 600;\">Stats rows<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 0; border-top: 1px solid #DEDFE0;\">4 → 2×2 grid with hairline dividers; numerals 64 → 52 → 40.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding: 6px 8px 6px 0; border-top: 1px solid #DEDFE0; font-weight: 600;\">Header<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 0; border-top: 1px solid #DEDFE0;\">Below 1024: logo plus a hamburger (44px target). The menu opens full-screen on white with accordion sections, and the Talk to an Expert button sits at the bottom.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding: 6px 8px 6px 0; border-top: 1px solid #DEDFE0; font-weight: 600;\">Footer<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 0; border-top: 1px solid #DEDFE0;\">Link columns become accordions; newsletter goes full width; legal links wrap.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding: 6px 8px 6px 0; border-top: 1px solid #DEDFE0; font-weight: 600;\">Hover-only reveals<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 0; border-top: 1px solid #DEDFE0;\">Touch has no hover. Mosaic labels sit on the photo over a bottom scrim, and the Leadership bio opens in a bottom sheet on tap.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding: 6px 8px 6px 0; border-top: 1px solid #DEDFE0; border-bottom: 1px solid #DEDFE0; font-weight: 600;\">Buttons<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 0; border-top: 1px solid #DEDFE0; border-bottom: 1px solid #DEDFE0;\">Full width and stacked below 768; primary on top.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n\n    <h2 style=\"break-before: page; margin: 0 0 6px; font-family: 'Poppins', sans-serif; font-size: 20pt; letter-spacing: -0.03em; text-transform: uppercase; color: #52565A;\"><span style=\"font-weight: 300;\">05 · Imagery, icons &amp; <\u002Fspan><span style=\"font-weight: 600;\">interaction<\u002Fspan><\u002Fh2>\n    <ul style=\"margin: 0; padding-left: 18px;\">\n      <li><strong>Hero photos:<\u002Fstrong> full bleed, object-fit cover, 16:9 minimum source, focal point in the lower-left third. Heights are 700 (homepage) and 560 (interior) on desktop; mobile crops to 4:3. A 100×100 white triangular notch sits lower-right (44×44 on mobile). Never put an accent bar on a hero image.<\u002Fli>\n      <li><strong>Placeholders<\u002Fstrong> in the Figma file are solid Dark Charcoal with one 45° line through the right third. Replace them with photography at the aspect ratio shown in each slot's label.<\u002Fli>\n      <li><strong>Aspect ratios:<\u002Fstrong> cards 4:3 · split-panel photo 4:3 · Assembly + Specs photo 4:5 · video 16:9 · leadership portrait 3:4 · gallery lead 16:9 (mobile 4:3).<\u002Fli>\n      <li><strong>Corners are square.<\u002Fstrong> Adjacent images sit on 2px white gaps.<\u002Fli>\n      <li><strong>Icons:<\u002Fstrong> the CP_v01 line set only, 1.15 stroke in Dark Charcoal (Green on sustainability), shown bare with no circle well on open grids, at 52 desktop and 40 mobile. Use the *_Line.svg files; the raw CP_v01 files have no stroke style and render filled.<\u002Fli>\n      <li><strong>Accent bars:<\u002Fstrong> 40×3px, placed under a card photo or above a leading copy block. Mix Blue and Orange across a row, never all one color.<\u002Fli>\n      <li><strong>Text link:<\u002Fstrong> the label sits over a 2px track the width of the label (resting rgba(0,0,0,0.12)). On hover, a bar fills the track left to right in 0.4s ease and turns Orange (Green or Blue variants; the White variant for dark surfaces). Inside cards, the track spans the full column, and a 40px Blue or Orange bar at rest fills the track on hover.<\u002Fli>\n      <li><strong>Pagination:<\u002Fstrong> inactive dots are 6px Mid Gray; the active dot is an Orange pill 26px wide.<\u002Fli>\n      <li><strong>Active nav:<\u002Fstrong> a 3px Orange bar under the current section.<\u002Fli>\n    <\u002Ful>\n\n    <h2 style=\"break-before: page; margin: 0 0 6px; font-family: 'Poppins', sans-serif; font-size: 20pt; letter-spacing: -0.03em; text-transform: uppercase; color: #52565A;\"><span style=\"font-weight: 300;\">06 · <\u002Fspan><span style=\"font-weight: 600;\">Components<\u002Fspan><\u002Fh2>\n    <p>Each entry gives the Figma component name, its variants, the anatomy (top to bottom), how it behaves at each breakpoint, and how to build it in Elementor. The HTML library shows every component live.<\u002Fp>\n    <div style=\"break-inside: avoid; margin-top: 14px; border-top: 1.5px solid #52565A; padding-top: 10px;\">\n      <div style=\"display: flex; align-items: baseline; gap: 10px;\"><span style=\"font-family: 'Poppins', sans-serif; font-weight: 300; font-size: 10pt; color: #7F8A92;\">01<\u002Fspan><span style=\"font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 12pt; text-transform: uppercase; color: #52565A;\">Header<\u002Fspan><\u002Fdiv>\n      <sc-raw-table style=\"font-size: 9pt; margin-top: 6px;\"><sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td style=\"padding: 4px 10px 4px 0; width: 92px; color: #7F8A92; vertical-align: top;\">Variants<\u002Fsc-raw-td><sc-raw-td style=\"padding: 4px 0;\">Over photo · White · Menu closed · Products open · Mobile menu<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding: 4px 10px 4px 0; color: #7F8A92; vertical-align: top;\">Anatomy<\u002Fsc-raw-td><sc-raw-td style=\"padding: 4px 0;\">Translucent announcement bar → logo (long, 30px; white over photo) → nav (Our Approach · Products · Projects · Insights · Contact) → outlined Talk to an Expert button. Products opens a translucent 4-column mega-menu.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding: 4px 10 ; vertical-align: top;\">System Overview + Materials<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 10px; border-top: 1px solid #DEDFE0; width: 36px; text-align: right; vertical-align: top;\">1<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 0; border-top: 1px solid #DEDFE0;\">Infinite Facade®<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"padding: 6px 10px 6px 0; border-top: 1px solid #DEDFE0; width: 170px; font-weight: 600; vertical-align: top;\">Leadership Card<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 10px; border-top: 1px solid #DEDFE0; width: 36px; text-align: right; vertical-align: top;\">1<\u002Fsc-raw-td><sc-raw-td style=\"padding: 6px 0; border-top: 1px solid #DEDFE0;\">Leadership<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody><\u002Fsc-raw-table>\n\n    <h2 style=\"break-before: page; margin: 0 0 6px; font-family: 'Poppins', sans-serif; font-size: 20pt; letter-spacing: -0.03em; text-transform: uppercase; color: #52565A;\"><span style=\"font-weight: 300;\">08 · Building in <\u002Fspan><span style=\"font-weight: 600;\">Elementor<\u002Fspan><\u002Fh2>\n    <ol style=\"margin: 0; padding-left: 18px;\">\n      <li><strong>Site Settings first:<\u002Fstrong> enter the eight Global Colors and the Global Fonts (12 scale styles + 21 Utility styles) exactly as named in sections 02–03, with the tablet and mobile sizes set in each font's responsive controls. Keep Elementor's default breakpoints (Tablet 1024, Mobile 767).<\u002Fli>\n      <li><strong>Theme Builder:<\u002Fstrong> Header (transparent over hero; white variant after scroll), Footer, and the Brand Sign-off Band as a global section above the footer.<\u002Fli>\n      <li><strong>Build each component once as a Saved Template<\u002Fstrong> (or a Global Widget where the content is identical sitewide, such as CARBONSHIELD® and the Brand Sign-off Band). Name each template exactly as its Figma component.<\u002Fli>\n      <li><strong>Assemble pages from the templates<\u002Fstrong> in recipe order. Don't style inside a page. If a page needs a change, it goes into the template.<\u002Fli>\n      <li><strong>Custom CSS needed<\u002Fstrong> (add once, in Site Settings → Custom CSS): the text-link track and hover fill, the hero 45° line and notch (clip-path), the orange-pill pagination, and the peek-a-boo video carousel.<\u002Fli>\n      <li><strong>Loops:<\u002Fstrong> Insights feeds, Related Content, Featured Resources and the Projects index are Loop Grids driven by post types (Posts, Projects, Resources), with the Canonical Card as the loop item.<\u002Fli>\n    <\u002Fol>\n\n    <h2 style=\"break-before: page; margin: 0 0 6px; font-family: 'Poppins', sans-serif; font-size: 20pt; letter-spacing: -0.03em; text-transform: uppercase; color: #52565A;\"><span style=\"font-weight: 300;\">09 · Content handoff &amp; <\u002Fspan><span style=\"font-weight: 600;\">open items<\u002Fspan><\u002Fh2>\n    <p>The system's structure is final. The items below are content Clark Pacific's team supplies during the build. None of them change a layout.<\u002Fp>\n    <sc-raw-table style=\"font-size: 9.5pt;\">\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td style=\"padding: 7px 10px 7px 0; border-top: 1px solid #DEDFE0; width: 170px; font-weight: 600;\">Photography<\u002Fsc-raw-td><sc-raw-td style=\"padding: 7px 0; border-top: 1px solid #DEDFE0;\">Every Dark Charcoal slot, at the ratio in its label. Heroes are lower-left focal.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding: 7px 10px 7px 0; border-top: 1px solid #DEDFE0; font-weight: 600;\">Video<\u002Fsc-raw-td><sc-raw-td style=\"padding: 7px 0; border-top: 1px solid #DEDFE0;\">AccelCore, PARC, NetZERO, Sustainability<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding: 7px 10px 7px 0; border-top: 1px solid #DEDFE0; font-weight: 600;\">FAQs<\u002Fsc-raw-td><sc-raw-td style=\"padding: 7px 0; border-top: 1px solid #DEDFE0;\">Parking (placeholders) and AccelDeck; the others are carried over from the live site<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding: 7px 10px 7px 0; border-top: 1px solid #DEDFE0; font-weight: 600;\">Quotes<\u002Fsc-raw-td><sc-raw-td style=\"padding: 7px 0; border-top: 1px solid #DEDFE0;\">Careers employee quote<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding: 7px 10px 7px 0; border-top: 1px solid #DEDFE0; font-weight: 600;\">Documents<\u002Fsc-raw-td><sc-raw-td style=\"padding: 7px 0; border-top: 1px solid #DEDFE0;\">Parking Design Guide PDF, Finishes Guide PDF, datasheets, the per-page Featured Resources list<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding: 7px 10px 7px 0; border-top: 1px solid #DEDFE0; font-weight: 600;\">Copy from the live site<\u002Fsc-raw-td><sc-raw-td style=\"padding: 7px 0; border-top: 1px solid #DEDFE0;\">Infinite Facade® system overview and materials, Spotlight Opportunities, Assembly + Specs values, footer copy<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding: 7px 10px 7px 0; border-top: 1px solid #DEDFE0; border-bottom: 1px solid #DEDFE0; font-weight: 600;\">Figures to confirm<\u002Fsc-raw-td><sc-raw-td style=\"padding: 7px 0; border-top: 1px solid #DEDFE0; border-bottom: 1px solid #DEDFE0;\">Data Centers slide 24 (“20% less cement”) and Infinite Facade® slide 49 (“40% less cement”) vs the approved CARBONSHIELD® figures (25% of cement replaced, ~20% less embodied carbon)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n    <h3 style=\"margin: 18px 0 6px; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 11pt; text-transform: uppercase; color: #52565A;\">Decisions for Clark Pacific<\u002Fh3>\n    <ol style=\"margin: 0; padding-left: 18px;\">\n      <li><strong>Header:<\u002Fstrong> white header with the color logo (slide 63), on the homepage only or on every page. The Figma header component has both variants.<\u002Fli>\n      <li><strong>Insights listing pages<\u002Fstrong> (Blog, In the News, Webinars, Resources) are cut back to hero + footer, pending the decision to consolidate them.<\u002Fli>\n    <\u002Fol>\n    <h3 style=\"margin: 18px 0 6px; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 11pt; text-transform: uppercase; color: #52565A;\">Keeping the system healthy<\u002Fh3>\n    <ul style=\"margin: 0; padding-left: 18px;\">\n      <li>Change a component in the Figma library, publish, then update the matching Elementor template. The pages follow automatically.<\u002Fli>\n      <li>Before adding a new component, check whether a variant of an existing one covers the need. New components get a Desktop and a Mobile variant, a page in this document, and a saved Elementor template.<\u002Fli>\n      <li>Nothing is ever colored outside the palette in section 02.<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n<\u002Fdoc-page>\n\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
